<!DOCTYPE html>
<html lang="en">
    <head>
        <title>BLACK JACK ASSIGNMENT 2</title>
       
    <body>
        <section>
            <div class = "container">
            <h2>BLACK JACK</h2>
            <h3>LET'S PLAY</h3>
            <div><h2 id = "Announcements"></h2></div>
            <div class = "CARDSECTION">
            <div class="PLAYERSECTION">
            <h2>YOU :<span id = "Scores">0</span></h2>
            <div id = "PlayerCards" ></div>
            </div>
            <div class="COMPUTERSECTION">
                <h2>COMPUTER :<span id = "pcScores">0</span></h2>
                <div id = "ComputerCards" ></div>
                </div>
            
    

            <div class = "BUTTONS">
                <form >
                    <input type="button1" id = "StartGame" value="Play" onclick="dealCard()">
                    <input type="button2" id = "ContinueGame" value="Continue" onclick ="mouseContinue()">
                    <input type="button3" id = "stopGame" value="Stop" onclick = "mouseStop()">
                    <input type="button4" id = "Restart" value="Restart" onclick = "restartGame()">
                </form>
            </div>
            </div>
        </section>
        <script src = "BlackJack.js"></script>
        <link rel="stylesheet" href="BlackJack.css">
    </head>
</html>
</html>
